<!-- Beside the About and WAD Library popups, and inside #menu for the same reason. It opens from a
     row in either of those lists, so it sits a rung above both. -->
<div id="wadinfo" class="overlay hidden">
  <div class="panel">
    <header>
      <h2 id="wadinfo-title"></h2>
      <span id="wadinfo-source" class="truncate"></span>
      <button id="wadinfo-close">Close</button>
    </header>
    <pre id="wadinfo-text"></pre>
  </div>
</div>
