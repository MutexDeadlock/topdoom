<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TopDoom</title>
    <link rel="stylesheet" href="/src/ui/menu.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="profiler-hud"></div>

    <div id="game-hud">
      <div class="hud-stat hud-health">
        <canvas class="icon icon-normal"></canvas>
        <canvas class="icon icon-berserk hidden"></canvas>
        <span class="value">100</span>
      </div>
      <div class="hud-stat hud-armor empty">
        <canvas class="icon icon-green hidden"></canvas>
        <canvas class="icon icon-blue hidden"></canvas>
        <span class="value">0</span>
      </div>
      <div class="hud-stat hud-ammo">
        <div class="row-bullets"><canvas class="icon"></canvas><span class="value">0</span></div>
        <div class="row-shells"><canvas class="icon"></canvas><span class="value">0</span></div>
        <div class="row-rockets"><canvas class="icon"></canvas><span class="value">0</span></div>
        <div class="row-cells"><canvas class="icon"></canvas><span class="value">0</span></div>
      </div>
      <div class="hud-stat hud-keys">
        <div class="key-blue"><canvas class="icon"></canvas></div>
        <div class="key-red"><canvas class="icon"></canvas></div>
        <div class="key-yellow"><canvas class="icon"></canvas></div>
      </div>
      <div class="hud-stat hud-weapon"></div>
      <div class="hud-stat hud-powers"></div>
    </div>

    <div id="screen-tint"></div>
    <div id="pain-flash"></div>

    <div id="death-overlay" class="hidden">
      <div class="title">YOU DIED</div>
      <div class="hint">press R to restart</div>
    </div>

    <div id="menu" class="hidden">
      <div class="panel">
        <header>
          <h1>TOPDOOM</h1>
          <p class="sub">Top-down DOOM on the original IWADs</p>
        </header>

        <section>
          <h2>Game WAD</h2>
          <div class="list" id="iwad-list"></div>
          <button class="ghost" id="iwad-upload">Load IWAD from disk…</button>
        </section>

        <section>
          <h2>Add-ons <span class="hint">optional, applied in order</span></h2>
          <div class="list" id="pwad-list"></div>
          <button class="ghost" id="pwad-upload">Add PWAD from disk…</button>
        </section>

        <section>
          <h2>Level</h2>
          <select id="level-select"></select>
        </section>

        <section>
          <h2>Difficulty</h2>
          <select id="difficulty-select"></select>
        </section>

        <footer>
          <button class="primary" id="start-button">Start</button>
          <span id="menu-status"></span>
        </footer>
      </div>
      <input type="file" id="file-input" accept=".wad,.WAD" hidden />
      <div id="menu-credit">by @fauler420</div>
      <div id="menu-version"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
